services:
  burger-haven:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/burger_haven.db
      UPLOAD_DIR: /app/uploads
      PORT: 8000
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    restart: unless-stopped
